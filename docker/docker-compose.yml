services:
  postgres:
    image: postgres:16-alpine
    container_name: mangatracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mangatracker
      POSTGRES_PASSWORD: mangatracker
      POSTGRES_DB: mangatracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangatracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
